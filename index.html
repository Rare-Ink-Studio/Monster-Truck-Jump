<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monster Truck Jump</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(#7bdcff, #dff7ff);
  text-align: center;
  color: #222;
}

h1 {
  margin: 6px 0 0;
  font-size: 36px;
  color: #00b0ff;
  text-shadow: 2px 2px white;
}

.subtitle {
  font-size: 16px;
  color: #444;
  margin-bottom: 4px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.game {
  position: relative;
  width: 92vw;
  max-width: 900px;
  height: 58vh;
  margin: auto;
  overflow: hidden;
  border: 6px solid #333;
  border-radius: 22px;
  background: linear-gradient(#8ee3ff 0%, #b8f7ff 55%, #90be6d 56%, #5c9440 100%);
  box-shadow: 0 0 25px rgba(0,0,0,0.25);
  cursor: pointer;
}

.cloud {
  position: absolute;
  top: 40px;
  width: 90px;
  height: 38px;
  background: white;
  border-radius: 50px;
  opacity: 0.85;
  animation: cloudMove 18s linear infinite;
}

.cloud::before {
  content: "";
  position: absolute;
  left: 18px;
  top: -18px;
  width: 38px;
  height: 38px;
  background: white;
  border-radius: 50%;
}

.cloud::after {
  content: "";
  position: absolute;
  right: 18px;
  top: -12px;
  width: 32px;
  height: 32px;
  background: white;
  border-radius: 50%;
}

.cloud.one {
  left: 10%;
}

.cloud.two {
  left: 65%;
  top: 75px;
  animation-duration: 24s;
}

@keyframes cloudMove {
  from { transform: translateX(900px); }
  to { transform: translateX(-1100px); }
}

.track {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 30%;
  background: linear-gradient(#8b5a2b, #5a3518);
  border-top: 8px solid #3b220f;
}

.track-lines {
  position: absolute;
  bottom: 18%;
  width: 100%;
  height: 8px;
  background: repeating-linear-gradient(
    to right,
    #ffd166 0,
    #ffd166 45px,
    transparent 45px,
    transparent 90px
  );
  animation: roadMove 1.45s linear infinite;
}

@keyframes roadMove {
  from { background-position-x: 0; }
  to { background-position-x: -90px; }
}

.truck {
  position: absolute;
  left: 64px;
  bottom: 95px;
  width: 250px;
  height: 150px;
  transform-origin: center bottom;
  z-index: 5;
}

.truck.landing {
  animation: landingBounce 0.24s ease-out;
}

@keyframes landingBounce {
  0% { transform: scaleY(1) scaleX(1); }
  35% { transform: scaleY(0.9) scaleX(1.06); }
  70% { transform: scaleY(1.04) scaleX(0.98); }
  100% { transform: scaleY(1) scaleX(1); }
}

.truck-body {
  position: absolute;
  bottom: 44px;
  left: 24px;
  width: 190px;
  height: 82px;
  background: linear-gradient(45deg, #00c853, #00b0ff);
  border: 5px solid #222;
  border-radius: 26px 26px 15px 15px;
  box-shadow: inset 0 -10px rgba(0,0,0,0.18);
  z-index: 5;
}

.truck-cab {
  position: absolute;
  bottom: 118px;
  left: 104px;
  width: 78px;
  height: 48px;
  background: #4fc3f7;
  border: 5px solid #222;
  border-radius: 18px 18px 6px 6px;
  z-index: 6;
}

.window {
  position: absolute;
  left: 16px;
  top: 11px;
  width: 39px;
  height: 21px;
  background: #dff7ff;
  border: 3px solid #222;
  border-radius: 7px;
}

.wheel {
  position: absolute;
  bottom: 2px;
  width: 76px;
  height: 76px;
  background: #111;
  border-radius: 50%;
  border: 7px solid #333;
  animation: wheelSpin 0.35s linear infinite;
  z-index: 10;
}

.wheel::after {
  content: "";
  position: absolute;
  inset: 19px;
  background: #aaa;
  border-radius: 50%;
}

.wheel.left {
  left: 18px;
}

.wheel.right {
  left: 150px;
}

@keyframes wheelSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.obstacle {
  position: absolute;
  right: -100px;
  bottom: 82px;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  z-index: 4;
  user-select: none;
}

.message {
  min-height: 30px;
  font-size: 22px;
  font-weight: bold;
  color: #00b0ff;
  margin-top: 8px;
  text-shadow: 1px 1px white;
}

button {
  margin: 6px;
  padding: 12px 24px;
  font-size: 19px;
  font-weight: bold;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.15s;
}

button:hover {
  transform: scale(1.06);
}

.jump {
  background: #06d6a0;
  color: #111;
}

.reset {
  background: #ffd166;
  color: #111;
}

.sound {
  background: #9b5de5;
  color: white;
}

.tip {
  margin: 4px auto 0;
  width: 88vw;
  max-width: 820px;
  font-size: 14px;
  color: #333;
  opacity: 0.8;
}

.game-over {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  color: white;
  z-index: 20;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  font-size: 28px;
}

.game-over button {
  background: #06d6a0;
}
</style>
</head>

<body>

<h1>MONSTER TRUCK JUMP</h1>

<div class="subtitle">
Jump the obstacles and keep rolling!
</div>

<div class="stats">
  <div>Score: <span id="score">0</span></div>
  <div>Best: <span id="best">0</span></div>
</div>

<div class="game" id="game">

  <div class="cloud one"></div>
  <div class="cloud two"></div>

  <div class="truck" id="truck">

    <div class="truck-cab">
      <div class="window"></div>
    </div>

    <div class="truck-body"></div>

    <div class="wheel left"></div>
    <div class="wheel right"></div>

  </div>

  <div class="obstacle" id="obstacle">🚧</div>

  <div class="track"></div>
  <div class="track-lines"></div>

  <div class="game-over" id="gameOver">
    <div>Oops! Try again!</div>
    <button onclick="resetGame()">Restart</button>
  </div>

</div>

<div class="message" id="message">
Tap anywhere or press Jump!
</div>

<button class="jump" onclick="jump()">JUMP!</button>
<button class="reset" onclick="resetGame()">Reset</button>
<button class="sound" onclick="toggleSound()" id="soundButton">Sound: On</button>

<div class="tip">
Tip: Tap early and let the monster truck float over the obstacle.
</div>

<script>
let score = 0;
let best = Number(localStorage.getItem("monsterTruckBestScore") || 0);

let obstacleX = 900;

let groundY = 95;
let truckY = groundY;

let isJumping = false;
let jumpStartTime = 0;

let jumpDuration = 2200;
let jumpHeight = 200;

let gameRunning = true;
let soundOn = true;
let engineStarted = false;

let obstacleSpeed = 2.75;
let nextObstacleReset = 1030;

const normalEngineVolume = 0.16;
const duckedEngineVolume = 0.035;

const truck = document.getElementById("truck");
const obstacle = document.getElementById("obstacle");
const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const gameOver = document.getElementById("gameOver");
const soundButton = document.getElementById("soundButton");

bestText.textContent = best;

const obstacleChoices = [
  "🚧",
  "🛢️",
  "🪨",
  "📦",
  "🧸",
  "🪵",
  "⚽",
  "🦖",
  "🚲",
  "🛸"
];

const encouragements = [
  "Great job!",
  "Awesome jump!",
  "Big air!",
  "You cleared it!",
  "Monster move!",
  "Nice landing!",
  "Super jump!",
  "That was huge!",
  "Way to go!",
  "You crushed it!"
];

const engineAudio = new Audio("MonsterTruckSound.mp3");
engineAudio.loop = true;
engineAudio.volume = normalEngineVolume;

function startEngine() {
  if (!soundOn) return;

  engineAudio.play()
    .then(function() {
      engineStarted = true;
    })
    .catch(function() {
      console.log("Engine sound waiting for first click.");
    });
}

function stopEngine() {
  engineAudio.pause();
}

function duckEngine() {
  if (!soundOn) return;

  engineAudio.volume = duckedEngineVolume;

  setTimeout(function() {
    if (soundOn && gameRunning) {
      engineAudio.volume = normalEngineVolume;
    }
  }, 650);
}

function playJumpSound() {
  if (!soundOn) return;

  duckEngine();

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const spring = ctx.createOscillator();
  const pop = ctx.createOscillator();
  const sparkle = ctx.createOscillator();
  const gain = ctx.createGain();

  spring.type = "triangle";
  pop.type = "sine";
  sparkle.type = "square";

  spring.frequency.setValueAtTime(420, ctx.currentTime);
  spring.frequency.exponentialRampToValueAtTime(1250, ctx.currentTime + 0.16);

  pop.frequency.setValueAtTime(760, ctx.currentTime);
  pop.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + 0.24);

  sparkle.frequency.setValueAtTime(980, ctx.currentTime);
  sparkle.frequency.exponentialRampToValueAtTime(1350, ctx.currentTime + 0.10);

  gain.gain.setValueAtTime(0.58, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.38);

  spring.connect(gain);
  pop.connect(gain);
  sparkle.connect(gain);
  gain.connect(ctx.destination);

  spring.start();
  pop.start();
  sparkle.start();

  spring.stop(ctx.currentTime + 0.38);
  pop.stop(ctx.currentTime + 0.38);
  sparkle.stop(ctx.currentTime + 0.20);
}

function playLandingSound() {
  if (!soundOn) return;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(95, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.12);

  gain.gain.setValueAtTime(0.09, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.16);
}

function playCrashSound() {
  if (!soundOn) return;

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(120, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.28);

  gain.gain.setValueAtTime(0.18, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.34);

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start();
  osc.stop(ctx.currentTime + 0.34);
}

function toggleSound() {
  soundOn = !soundOn;

  if (soundOn) {
    soundButton.textContent = "Sound: On";
    engineAudio.volume = normalEngineVolume;
    startEngine();
  } else {
    soundButton.textContent = "Sound: Off";
    stopEngine();
  }
}

function jump() {
  if (!gameRunning) return;

  startEngine();

  if (!isJumping) {
    isJumping = true;
    jumpStartTime = performance.now();
    playJumpSound();
    message.textContent = "Boing! Big jump!";
  }
}

function randomObstacle() {
  obstacle.textContent =
    obstacleChoices[
      Math.floor(Math.random() * obstacleChoices.length)
    ];
}

function landingBounce() {
  truck.classList.remove("landing");

  void truck.offsetWidth;

  truck.classList.add("landing");

  setTimeout(function() {
    truck.classList.remove("landing");
  }, 260);
}

function updateTruck() {
  if (isJumping) {
    const elapsed = performance.now() - jumpStartTime;
    let t = elapsed / jumpDuration;

    if (t >= 1) {
      t = 1;
      isJumping = false;
      truckY = groundY;
      playLandingSound();
      landingBounce();
    } else {
      const baseArc = Math.sin(t * Math.PI);
      const roundedArc = Math.pow(baseArc, 0.45);

      truckY = groundY + (roundedArc * jumpHeight);
    }

    let rotation = 0;

    if (t < 0.25) {
      rotation = -4;
    } else if (t > 0.75) {
      rotation = 4;
    } else {
      rotation = 0;
    }

    if (!isJumping) {
      rotation = 0;
    }

    truck.style.transform = "rotate(" + rotation + "deg)";
  } else {
    truckY = groundY;
    truck.style.transform = "rotate(0deg)";
  }

  truck.style.bottom = truckY + "px";
}

function updateObstacle() {
  obstacleX -= obstacleSpeed;

  if (obstacleX < -100) {
    obstacleX = nextObstacleReset;

    randomObstacle();

    score++;

    scoreText.textContent = score;

    if (score > best) {
      best = score;
      bestText.textContent = best;
      localStorage.setItem("monsterTruckBestScore", best);
    }

    message.textContent =
      encouragements[
        Math.floor(Math.random() * encouragements.length)
      ];
  }

  obstacle.style.right = (900 - obstacleX) + "px";
}

function checkCollision() {
  const truckRect = truck.getBoundingClientRect();
  const obstacleRect = obstacle.getBoundingClientRect();

  const truckIsSafelyInAir = truckY > 112;

  const horizontalOverlap =
    truckRect.right > obstacleRect.left + 62 &&
    truckRect.left < obstacleRect.right - 52;

  const verticalOverlap =
    truckRect.bottom > obstacleRect.top + 54 &&
    truckRect.top < obstacleRect.bottom - 46;

  const hit =
    horizontalOverlap &&
    verticalOverlap &&
    !truckIsSafelyInAir;

  if (hit) {
    gameRunning = false;

    playCrashSound();

    stopEngine();

    message.textContent = "Almost! Try again!";

    gameOver.style.display = "flex";
  }
}

function resetGame() {
  score = 0;
  obstacleX = 900;
  truckY = groundY;
  isJumping = false;
  gameRunning = true;

  scoreText.textContent = score;

  truck.style.bottom = truckY + "px";
  truck.style.transform = "rotate(0deg)";
  truck.classList.remove("landing");

  gameOver.style.display = "none";

  message.textContent = "Tap anywhere or press Jump!";

  randomObstacle();

  if (soundOn) {
    engineAudio.currentTime = 0;
    engineAudio.volume = normalEngineVolume;
    startEngine();
  }
}

document.addEventListener("keydown", function(event) {
  if (event.code === "Space") {
    jump();
  }
});

game.addEventListener("pointerdown", function() {
  jump();
});

document.addEventListener("click", function(event) {
  startEngine();
}, { once: true });

randomObstacle();

function gameLoop() {
  if (gameRunning) {
    updateTruck();
    updateObstacle();
    checkCollision();
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
